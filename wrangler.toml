name = "qq-bot-cloudflare"
main = "src/index.ts"
compatibility_date = "2025-01-01"
assets = { directory = "./public" }

[observability]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "DB"
database_name = "qq-bot-db"
database_id = "此处填写你的 D1 database_id"

[ai]
binding = "AI"

[vars]
QQ_BOT_VERIFY_SIGNATURE = "true"
AGNESAI_BASE_URL = "https://apihub.agnes-ai.com/v1"
AGNESAI_MODEL = "agnes-2.0-flash"
AI_MAX_INPUT_TOKENS = "8192"
