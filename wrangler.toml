name = "qq-bot-cloudflare"
main = "src/index.ts"
compatibility_date = "2025-01-01"
assets = { directory = "./public" }

# 声明了 [[routes]] 后 Wrangler 4.x 会把这两项默认为 false；线上原本是 true，
# 显式写回来，避免部署后 workers.dev 地址与预览 URL 被顺手关掉。
workers_dev = true
preview_urls = true

[observability]
enabled = true
# 保留全量 console 日志，便于用 wrangler tail 排查线上问题。
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "qq-bot-db"
# 换成你自己的 D1 数据库 ID（npx wrangler d1 create qq-bot-db 的输出）
database_id = "CHANGE_ME_D1_DATABASE_ID"

[ai]
binding = "AI"

# 自定义域名必须在本地声明。wrangler deploy 以本地配置为准，会把控制台里
# 单独添加的 Custom Domain 从远程配置中移除；漏掉这段会导致部署后
# https://bot.example.com/webhook/qqbot 失效、机器人收不到事件。
[[routes]]
pattern = "bot.example.com"
custom_domain = true

# 只放非敏感配置：随代码一起部署、明文保存。
[vars]
QQ_BOT_VERIFY_SIGNATURE = "true"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
NVIDIA_MODEL = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
AI_MAX_INPUT_TOKENS = "8192"
